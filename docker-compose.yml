# Minimal stack for trying the image out: `docker compose up`.
name: postgresql-postgis-timescaledb

networks:
  overlay:

volumes:
  pg_data:
    driver: local

services:
  postgres:
    # PPT_IMAGE lets the pipeline point this file at the freshly built image.
    image: ${PPT_IMAGE:-kirbownz/postgresql-postgis-timescaledb:latest}
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=homeassistant
      - POSTGRES_USER=homeassistant
      - POSTGRES_PASSWORD=homeassistant
    ports:
      - 5432:5432
    networks:
      - overlay
    volumes:
      # PostgreSQL 18's official image moved PGDATA to /var/lib/postgresql/18/docker and
      # declares the VOLUME one level up, so the mount point is /var/lib/postgresql — NOT
      # /var/lib/postgresql/data as it was for PostgreSQL <= 17.
      - pg_data:/var/lib/postgresql
    # The image ships its own healthcheck (pg_isready over TCP, 5 min start period so an
    # automatic major upgrade of a large database on first start is not reported as unhealthy).

