# Minimal stack for trying the image out: `docker compose up`.
name: postgresql-postgis-timescaledb

networks:
  overlay:

volumes:
  pg_data:
    driver: local

services:
  postgres:
    image: kirbownz/postgresql-postgis-timescaledb:latest
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=homeassistant
      - POSTGRES_USER=homeassistant
      - POSTGRES_PASSWORD=homeassistant
    ports:
      - 5432:5432
    networks:
      - overlay
    volumes:
      # PostgreSQL 18's official image moved PGDATA to /var/lib/postgresql/18/docker and
      # declares the VOLUME one level up, so the mount point is /var/lib/postgresql — NOT
      # /var/lib/postgresql/data as it was for PostgreSQL <= 17.
      - pg_data:/var/lib/postgresql
    healthcheck:
      # The image ships its own pg_isready healthcheck; this only shortens the start period.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

