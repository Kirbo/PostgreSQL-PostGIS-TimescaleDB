# Build, test and publish the PostgreSQL + PostGIS + TimescaleDB image.
#
# WHERE IT RUNS: the "Kirbo Mini" Mac Mini, never a metered SaaS runner. Every job takes the
# runner tag in $MAC_DOCKER (`default: tags` below): `macos` — the shared Docker runner — for
# branches and merge requests, `macos-protected` — a ref-protected Docker runner with its own
# cache, which only protected-ref jobs reach — for pipelines of the default branch (push, web,
# schedule), which hold the Docker Hub and repo-write tokens. The workflow rules set it; a job
# never names `macos` itself.
#
# NO DOCKER ENGINE: no job gets the Docker socket, Docker-in-Docker or privileged mode. Image
# builds AND tests go to a BuildKit server on the Mac over mutual TLS (`.buildkit` below): the
# protected one (:12340, BUILDKIT_PROTECTED_* client certificate, protected variables) on
# protected refs, the branch one (:12341, BUILDKIT_*) everywhere else. Registry work
# (imagetools, trivy) talks to the registries directly.
#
# HOW A PUBLISH HAPPENS — one build, tested, then re-tagged:
#   build    buildx builds every platform ONCE and pushes the result to this project's GitLab
#            container registry as :ci-<pipeline> (staging). Its digest goes to staging.env.
#   test     that staging digest, by digest, is the base of the test stages in tests/Dockerfile,
#            built on the BuildKit server (scripts/buildkit-test.sh): the smoke test on EVERY
#            platform (amd64 under emulation on the Apple Silicon Mac), the upgrade tests
#            (previous published images + every bundled older PostgreSQL major, both volume
#            layouts), the compose file; and a vulnerability scan straight from the registry.
#            The test steps start the image's own entrypoint inside RUN and are forced to run
#            every pipeline (a per-run token + no-cache-filter; a cached step fails the job).
#   publish  `imagetools create` re-tags the SAME digest onto the Docker Hub tags — nothing is
#            rebuilt, so the bytes that were tested are the bytes users pull — and verifies
#            every tag resolves to that digest with every platform present.
#
# HOW IT STAYS UP TO DATE — the weekly schedule commits, the commit builds:
#   the scheduled pipeline has ONE job. It resolves the newest PostgreSQL + PostGIS +
#   TimescaleDB combination upstream ships (scripts/resolve-versions.sh), plus the digest of
#   the official base image. If any of it differs from versions.env, it commits the new numbers
#   (versions.env + README) to the default branch — and the push pipeline of that commit is the
#   full build/test/publish. Nothing newer: no commit, no pipeline, nothing published. Every
#   published image therefore maps to a commit and `git log` is the upgrade history; a rebuilt
#   base image (Debian security updates) counts as "newer" through its digest.
#   Every pipeline that builds, builds exactly what versions.env says.
#
# JOB IMAGES are pinned by version AND digest, each a release at least 7 days old when chosen
# (/maintain bumps them). A tool a job needs beyond its image comes from mise.lock in locked mode
# (`mise install --locked`, through the pinned, checksummed mise of ci/install-mise.sh): jq in
# `compose test`, fnox + age in the jobs that read secrets. The alpine jobs' curl and git are
# Alpine's signed packages.
#
# SECRETS come from fnox.toml (age ciphertext, docs/SECRETS.md): the job's environment
# (`release/publish`, `release/versions`) gets its tier's age identity as the protected File
# variable FNOX_AGE_KEY_FILE, and ci/secrets.sh decrypts that tier's profile. Until those keys
# exist the same jobs use the plain variables below (the transition, docs/SECRETS.md).
#
# Requires: the project's container registry (staging; enable a cleanup policy for the
# `ci-.*` tags), the Docker Hub credentials (fnox profile `publish`, or DOCKERHUB_USERNAME +
# DOCKERHUB_TOKEN, protected), the repo-write token for the scheduled commit (fnox profile
# `versions`, or VERSIONS_PUSH_TOKEN, protected), the BuildKit client certificates as File
# variables BUILDKIT_CA/CERT/KEY (branch server) and BUILDKIT_PROTECTED_CA/CERT/KEY (protected),
# and the "Kirbo Mini Protected" runner assigned to the project.

stages:
  - resolve
  - lint
  - build
  - test
  - publish

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # One pipeline per change: MR pipelines win over branch pipelines when an MR is open.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    # The default branch — its push, web ("Run pipeline") and schedule pipelines all carry
    # CI_COMMIT_BRANCH, so this rule catches every one of them — runs on the protected runner.
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      variables:
        MAC_DOCKER: macos-protected
    - if: "$CI_COMMIT_BRANCH"
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  # The Mac Docker runner tag: `macos-protected` on the default branch (workflow rules above),
  # the shared `macos` runner everywhere else.
  MAC_DOCKER: "macos"
  # Docker Hub target. Change DOCKERHUB_REPOSITORY here (or as a CI/CD variable) to publish
  # somewhere else — nothing else in the repo hardcodes it.
  DOCKER_REGISTRY: docker.io
  DOCKERHUB_REPOSITORY: kirbownz/postgresql-postgis-timescaledb
  # Staging: the project's own registry, one tag per pipeline (ci-<pipeline id>).
  STAGING_IMAGE: $CI_REGISTRY_IMAGE
  GIT_DEPTH: "10"
  # mise (ci/install-mise.sh): trust this checkout's mise.toml without a prompt, and resolve every
  # install ONLY from the committed mise.lock — a tool, version or artifact it does not name fails.
  MISE_TRUSTED_CONFIG_PATHS: $CI_PROJECT_DIR
  MISE_LOCKED: "1"

default:
  tags:
    - $MAC_DOCKER
  interruptible: true

# --- shared bits -------------------------------------------------------------------------

# Registry-only jobs (publish): the docker CLI with buildx, no engine, no builder. `docker login`
# only writes ~/.docker/config.json, which buildx (imagetools, and the BuildKit server's pulls
# and pushes, through the session) reads.
.docker-cli:
  image: docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
  cache: []
  before_script:
    # gitlab-ci-token + CI_JOB_TOKEN on purpose: CI_REGISTRY_USER/PASSWORD are the predefined
    # names, but the other KirboDev image repos reuse CI_REGISTRY_USERNAME/PASSWORD as Docker
    # Hub aliases, and a custom variable would shadow the predefined one.
    - echo "${CI_JOB_TOKEN}" | docker login -u gitlab-ci-token --password-stdin "${CI_REGISTRY}"
  after_script:
    - docker logout "${CI_REGISTRY}" || true

# Build and test jobs: a buildx "remote" builder on the Mac's BuildKit server, over mutual TLS.
# Protected refs (the default branch) use the protected server with the protected client
# certificate (protected variables — unreadable elsewhere); everything else the branch server.
# Its own CA, so a branch certificate can never open the protected server.
.buildkit:
  extends: .docker-cli
  variables:
    BUILDER_NAME: "ppt-${CI_JOB_ID}"
  before_script:
    - !reference [.docker-cli, before_script]
    - |
      if [ "${CI_COMMIT_REF_PROTECTED}" = "true" ]; then
        CA="${BUILDKIT_PROTECTED_CA:-}" CERT="${BUILDKIT_PROTECTED_CERT:-}" KEY="${BUILDKIT_PROTECTED_KEY:-}" PORT=12340
      else
        CA="${BUILDKIT_CA:-}" CERT="${BUILDKIT_CERT:-}" KEY="${BUILDKIT_KEY:-}" PORT=12341
      fi
      for f in "$CA" "$CERT" "$KEY"; do
        [ -n "$f" ] && [ -s "$f" ] || { echo "ERROR: BuildKit client certificate missing: set the File variables BUILDKIT_CA/CERT/KEY (branch server) and BUILDKIT_PROTECTED_CA/CERT/KEY (protected) in Settings -> CI/CD -> Variables" >&2; exit 1; }
      done
      docker buildx create --name "${BUILDER_NAME}" --driver remote \
        --driver-opt "cacert=${CA},cert=${CERT},key=${KEY}" "tcp://host.docker.internal:${PORT}" --use
      docker buildx inspect --bootstrap
  after_script:
    # Client-side config only: the remote driver leaves nothing running on the Mac.
    - docker buildx rm "${BUILDER_NAME}" >/dev/null 2>&1 || true
    - !reference [.docker-cli, after_script]

# Jobs that take a tool from mise.lock: the pinned mise first (no mise in the job images).
.mise:
  before_script:
    - sh ci/install-mise.sh
    - export PATH="${HOME}/.local/bin:${PATH}"

# Everything but the resolve job: never on the schedule (which only commits).
.not_on_schedule:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

# Publishing happens on the default branch and on a "Run pipeline" that sets PUBLISH (any
# value) — never from a feature branch or MR, which only build and test.
.publish_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - if: '$CI_PIPELINE_SOURCE == "web" && $PUBLISH'
    - when: never

# --- resolve -----------------------------------------------------------------------------

# Every pipeline: build.env = the versions to build, always the pins in versions.env.
resolve versions:
  stage: resolve
  image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  extends: .not_on_schedule
  script:
    - RESOLVE_MODE_OVERRIDE=pinned sh scripts/resolve-versions.sh build.env
  artifacts:
    # dotenv: later jobs get PG_VERSION/POSTGIS_VERSION/... as environment variables.
    # paths:  the same values as a file, because the scripts source ./build.env directly.
    reports:
      dotenv: build.env
    paths:
      - build.env
    expire_in: 1 week

# The schedule's only job: ask upstream, commit if newer, done. RESOLVE_MODE=pinned in
# versions.env turns it into a no-op.
check upstream versions:
  stage: resolve
  image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  interruptible: false
  # Selects the `versions` fnox tier: its FNOX_AGE_KEY_FILE is scoped to this environment.
  environment:
    name: release/versions
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - apk add --no-cache curl git
    - . ci/secrets.sh
    - secrets_load versions
  script:
    - |
      [ -n "${VERSIONS_PUSH_TOKEN:-}" ] || { echo "ERROR: VERSIONS_PUSH_TOKEN is not set — the schedule cannot commit a version bump" >&2; exit 1; }
    - sh scripts/resolve-versions.sh build.env
    - |
      if [ "$(sed -n 's/^RESOLVED_FROM=//p' build.env)" != auto ]; then
        echo "nothing resolved from upstream (RESOLVE_MODE=pinned, or a lookup failed — see above); not committing"
        exit 0
      fi
    - sh scripts/commit-versions.sh

# --- lint ----------------------------------------------------------------------------------

shellcheck:
  stage: lint
  extends: .not_on_schedule
  image: koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
  needs: []
  script:
    - shellcheck -S warning scripts/*.sh ci/*.sh init-*.sh tests/run.sh
    # bash; output.sh + lib.sh are inputs so the variables they share are followed
    - shellcheck -S warning -s bash docker-entrypoint-ppt.sh scripts/output.sh tests/lib.sh tests/smoke.sh tests/compose.sh tests/upgrade.sh

hadolint:
  stage: lint
  extends: .not_on_schedule
  image: hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552
  needs: []
  script:
    - hadolint Dockerfile tests/Dockerfile

# mise.lock must name every pin in mise.toml for this platform: the jobs install from it in locked
# mode, so a stale lock would stop them (the secret-reading ones included). `--dry-run` installs
# nothing. Fix: `mise lock` (MISE_GITHUB_TOKEN set if GitHub's anonymous API limit bites), commit
# mise.lock.
mise lock:
  stage: lint
  extends:
    - .mise
    - .not_on_schedule
  image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  needs: []
  script:
    - mise install --locked --dry-run

# The resolver is a pile of curl + sed over three upstream APIs; a format change upstream
# would otherwise surface as a silent fallback to the pins. Pinned mode must reproduce
# versions.env exactly, auto mode must find something at least as new.
resolver:
  stage: lint
  extends: .not_on_schedule
  image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  needs: []
  before_script:
    - apk add --no-cache curl
  script:
    - RESOLVE_MODE_OVERRIDE=pinned sh scripts/resolve-versions.sh pinned.env
    - . ./versions.env
    - |
      for k in PG_MAJOR PG_VERSION POSTGIS_VERSION TIMESCALEDB_VERSION DEBIAN_SUITE PLATFORMS PG_IMAGE_DIGEST; do
        eval want="\$$k"
        got="$(sed -n "s/^$k=//p" pinned.env)"
        [ "$got" = "$want" ] || { echo "FAIL: pinned $k = '$got', versions.env says '$want'" >&2; exit 1; }
      done
      echo "ok: pinned mode reproduces versions.env"
    - RESOLVE_MODE_OVERRIDE=auto sh scripts/resolve-versions.sh auto.env
    - |
      [ "$(sed -n 's/^RESOLVED_FROM=//p' auto.env)" = auto ] || { echo "FAIL: auto mode fell back to the pins — an upstream lookup is broken" >&2; exit 1; }
      newest="$(printf '%s\n%s\n' "$PG_VERSION" "$(sed -n 's/^PG_VERSION=//p' auto.env)" | sort -t. -k1,1n -k2,2n | tail -n 1)"
      [ "$newest" = "$(sed -n 's/^PG_VERSION=//p' auto.env)" ] || { echo "FAIL: auto mode found PostgreSQL $(sed -n 's/^PG_VERSION=//p' auto.env), older than the pinned $PG_VERSION" >&2; exit 1; }
      echo "ok: auto mode resolves to $(sed -n 's/^PG_VERSION=//p' auto.env) @ $(sed -n 's/^PG_IMAGE_DIGEST=//p' auto.env) / $(sed -n 's/^POSTGIS_VERSION=//p' auto.env) / $(sed -n 's/^TIMESCALEDB_VERSION=//p' auto.env)"

# --- build ---------------------------------------------------------------------------------

# One multi-arch build on the BuildKit server, pushed to the staging registry. Everything
# downstream tests and publishes this exact digest.
build image:
  extends:
    - .buildkit
    - .not_on_schedule
  stage: build
  needs:
    - job: resolve versions
      artifacts: true
  script:
    - sh scripts/docker-buildx-release.sh build
  artifacts:
    reports:
      dotenv: staging.env
    paths:
      - staging.env
      - staging-metadata.json
    expire_in: 1 week

# --- test --------------------------------------------------------------------------------

# The test suites are BuildKit build stages (tests/Dockerfile, run by scripts/buildkit-test.sh)
# FROM the staging digest: nothing is pulled into the job, nothing runs in the job container.
# test-results/ holds each step's "PASS <run token>" — the proof the step ran in this pipeline.
.test:
  extends:
    - .buildkit
    - .not_on_schedule
  stage: test
  needs:
    - job: resolve versions
      artifacts: true
    - job: build image
      artifacts: true
  artifacts:
    when: always
    paths:
      - test-results/
    expire_in: 1 week

# Starts the image, asserts the versions, fills a hypertable, queries a spatial index, replays
# the Home Assistant LTSS DDL, checks the healthcheck and the defaults — per platform.
smoke test:
  extends: .test
  parallel:
    matrix:
      - PLATFORM: [linux/amd64, linux/arm64]
  script:
    - sh scripts/buildkit-test.sh smoke "${STAGING_REF}"

# Existing installs must survive the new image: the previously published :latest, the oldest
# published tag of the same major, and a real PostgreSQL <major> data directory for every
# older major the image can upgrade from — in both volume layouts. The BuildKit server's
# native architecture (arm64) only.
upgrade test:
  extends: .test
  timeout: 2h
  script:
    - sh scripts/buildkit-test.sh upgrade "${STAGING_REF}"

# `docker compose config` validates docker-compose.yml (no engine); its service — environment,
# volume, the image's healthcheck — is then started in a build stage.
compose test:
  extends: .test
  before_script:
    - !reference [.buildkit, before_script]
    - !reference [.mise, before_script]
    - mise install --locked jq
  script:
    - mise exec jq -- sh scripts/buildkit-test.sh compose "${STAGING_REF}"

# Debian base + apt packages, rebuilt weekly: a CVE scan is cheap here. Informational — the
# image ships regardless, the job just goes red in the pipeline view. Reads the staging image
# straight from the registry (TRIVY_IMAGE_SRC=remote: there is no Docker engine to ask).
#
# OS packages only (--pkg-types os). The one non-Debian binary in the image is the base image's
# gosu, whose Go stdlib CVEs Trivy lists by version alone: none is reachable (govulncheck
# -mode binary: "affected by 0 vulnerabilities"; gosu only setuid()s and exec()s), and only a
# new upstream postgres image can change it. Scanning it kept this job red on every pipeline,
# hiding the signal it exists for. /maintain checks gosu with govulncheck instead.
vulnerability scan:
  extends: .not_on_schedule
  stage: test
  image:
    name: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    entrypoint: [""]
  cache: []
  needs:
    - job: resolve versions
      artifacts: true
    - job: build image
      artifacts: true
  allow_failure: true
  variables:
    TRIVY_USERNAME: gitlab-ci-token
    TRIVY_PASSWORD: $CI_JOB_TOKEN
    TRIVY_IMAGE_SRC: remote
    TRIVY_NO_PROGRESS: "true"
    TRIVY_DISABLE_VEX_NOTICE: "true"
  script:
    - trivy image --scanners vuln --pkg-types os --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${STAGING_REF}"

# --- publish -----------------------------------------------------------------------------

# Re-tags the tested staging digest onto Docker Hub. No build, no engine: imagetools copies the
# manifest list (with its provenance/SBOM attestations) registry-to-registry, then the script
# verifies what Docker Hub serves. Protected runner + protected Docker Hub token (default
# branch); a PUBLISH run elsewhere has no token and stops with the error below.
publish image:
  extends:
    - .docker-cli
    - .publish_rules
  stage: publish
  # Publishing must not be auto-cancelled halfway by a new commit.
  interruptible: false
  # Selects the `publish` fnox tier: its FNOX_AGE_KEY_FILE is scoped to this environment.
  environment:
    name: release/publish
    action: prepare
  needs:
    - job: resolve versions
      artifacts: true
    - job: build image
      artifacts: true
    - job: smoke test
      artifacts: false
    - job: upgrade test
      artifacts: false
    - job: compose test
      artifacts: false
    # Lint gates the publish too: with `needs`, a red job that is not listed would not stop it.
    - job: shellcheck
      artifacts: false
    - job: hadolint
      artifacts: false
    - job: mise lock
      artifacts: false
    - job: resolver
      artifacts: false
  before_script:
    - !reference [.docker-cli, before_script]
    # Credentials: the fnox profile `publish` (ci/secrets.sh; a no-op until the tier's key
    # exists), else DOCKERHUB_USERNAME/DOCKERHUB_TOKEN, or the CI_REGISTRY_USERNAME/
    # CI_REGISTRY_PASSWORD names used by the other KirboDev image repos — whichever is set.
    - . ci/secrets.sh
    - secrets_load publish
    - export DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME:-${CI_REGISTRY_USERNAME:-}}"
    - export DOCKERHUB_TOKEN="${DOCKERHUB_TOKEN:-${CI_REGISTRY_PASSWORD:-}}"
    - |
      if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
        echo "ERROR: no Docker Hub credentials: add them to the fnox profile publish (docs/SECRETS.md), or set DOCKERHUB_USERNAME + DOCKERHUB_TOKEN (masked) in Settings -> CI/CD -> Variables" >&2
        exit 1
      fi
    - echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin "${DOCKER_REGISTRY}"
  script:
    - sh scripts/docker-buildx-release.sh publish
  after_script:
    - docker logout "${DOCKER_REGISTRY}" || true
    - !reference [.docker-cli, after_script]
