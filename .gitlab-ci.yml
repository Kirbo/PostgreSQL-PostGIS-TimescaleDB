# Build, test and publish the PostgreSQL + PostGIS + TimescaleDB image.
#
# WHERE IT RUNS: the "Kirbo Mini" Mac Mini runner (docker executor, tag `macos`), never a
# metered SaaS runner — `default: tags: [macos]` puts every job there. The docker jobs talk to
# the host's Docker Desktop daemon through the mounted socket (DOCKER_HOST below), the same
# way the electrolux-to-mqtt pipeline does; there is no docker-in-docker service.
#
# HOW A PUBLISH HAPPENS — one build, tested, then re-tagged:
#   build    buildx builds every platform ONCE and pushes the result to this project's GitLab
#            container registry as :ci-<pipeline> (staging). Its digest goes to staging.env.
#   test     that staging digest is pulled and run: the smoke test on EVERY platform (amd64
#            under emulation on the Apple Silicon runner), the upgrade tests (previous
#            published images + every bundled older PostgreSQL major, both volume layouts),
#            the compose file, and a vulnerability scan.
#   publish  `imagetools create` re-tags the SAME digest onto the Docker Hub tags — nothing is
#            rebuilt, so the bytes that were tested are the bytes users pull — and verifies
#            every tag resolves to that digest with every platform present.
#
# HOW IT STAYS UP TO DATE — the weekly schedule commits, the commit builds:
#   the scheduled pipeline has ONE job. It resolves the newest PostgreSQL + PostGIS +
#   TimescaleDB combination upstream ships (scripts/resolve-versions.sh), plus the digest of
#   the official base image. If any of it differs from versions.env, it commits the new numbers
#   (versions.env + README) to the default branch — and the push pipeline of that commit is the
#   full build/test/publish. Nothing newer: no commit, no pipeline, nothing published. Every
#   published image therefore maps to a commit and `git log` is the upgrade history; a rebuilt
#   base image (Debian security updates) counts as "newer" through its digest.
#   Every pipeline that builds, builds exactly what versions.env says.
#
# Requires: the project's container registry (staging; enable a cleanup policy for the
# `ci-.*` tags), DOCKERHUB_USERNAME + DOCKERHUB_TOKEN, and VERSIONS_PUSH_TOKEN for the
# scheduled commit.

stages:
  - resolve
  - lint
  - build
  - test
  - publish

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # One pipeline per change: MR pipelines win over branch pipelines when an MR is open.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  # Docker Hub target. Change DOCKERHUB_REPOSITORY here (or as a CI/CD variable) to publish
  # somewhere else — nothing else in the repo hardcodes it.
  DOCKER_REGISTRY: docker.io
  DOCKERHUB_REPOSITORY: kirbownz/postgresql-postgis-timescaledb
  # Staging: the project's own registry, one tag per pipeline (ci-<pipeline id>).
  STAGING_IMAGE: $CI_REGISTRY_IMAGE
  # One buildx builder per job, torn down in after_script — a leaked buildkit container on the
  # Mac would otherwise keep its cache volume alive forever.
  DOCKER_BUILDER_NAME: "ppt-builder-${CI_JOB_ID}"
  GIT_DEPTH: "10"

default:
  tags:
    - macos
  interruptible: true

# --- shared bits -------------------------------------------------------------------------

.docker:
  image: docker:cli
  cache: []
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
  before_script:
    # gitlab-ci-token + CI_JOB_TOKEN on purpose: CI_REGISTRY_USER/PASSWORD are the predefined
    # names, but the other KirboDev image repos reuse CI_REGISTRY_USERNAME/PASSWORD as Docker
    # Hub aliases, and a custom variable would shadow the predefined one.
    - echo "${CI_JOB_TOKEN}" | docker login -u gitlab-ci-token --password-stdin "${CI_REGISTRY}"
  after_script:
    - docker logout "${CI_REGISTRY}" || true
    - docker buildx rm "${DOCKER_BUILDER_NAME}" >/dev/null 2>&1 || true

# Everything but the resolve job: never on the schedule (which only commits).
.not_on_schedule:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

# Publishing happens on the default branch and on a "Run pipeline" that sets PUBLISH (any
# value) — never from a feature branch or MR, which only build and test.
.publish_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - if: '$CI_PIPELINE_SOURCE == "web" && $PUBLISH'
    - when: never

# --- resolve -----------------------------------------------------------------------------

# Every pipeline: build.env = the versions to build, always the pins in versions.env.
resolve versions:
  stage: resolve
  image: alpine:3
  extends: .not_on_schedule
  script:
    - RESOLVE_MODE_OVERRIDE=pinned sh scripts/resolve-versions.sh build.env
  artifacts:
    # dotenv: later jobs get PG_VERSION/POSTGIS_VERSION/... as environment variables.
    # paths:  the same values as a file, because the scripts source ./build.env directly.
    reports:
      dotenv: build.env
    paths:
      - build.env
    expire_in: 1 week

# The schedule's only job: ask upstream, commit if newer, done. RESOLVE_MODE=pinned in
# versions.env turns it into a no-op.
check upstream versions:
  stage: resolve
  image: alpine:3
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - apk add --no-cache curl git
  script:
    - |
      [ -n "${VERSIONS_PUSH_TOKEN:-}" ] || { echo "ERROR: VERSIONS_PUSH_TOKEN is not set — the schedule cannot commit a version bump" >&2; exit 1; }
    - sh scripts/resolve-versions.sh build.env
    - |
      if [ "$(sed -n 's/^RESOLVED_FROM=//p' build.env)" != auto ]; then
        echo "nothing resolved from upstream (RESOLVE_MODE=pinned, or a lookup failed — see above); not committing"
        exit 0
      fi
    - sh scripts/commit-versions.sh

# --- lint ----------------------------------------------------------------------------------

shellcheck:
  stage: lint
  extends: .not_on_schedule
  image: koalaman/shellcheck-alpine:stable
  needs: []
  script:
    - shellcheck -S warning scripts/*.sh init-*.sh
    - shellcheck -S warning -s bash docker-entrypoint-ppt.sh

hadolint:
  stage: lint
  extends: .not_on_schedule
  image: hadolint/hadolint:latest-alpine
  needs: []
  script:
    - hadolint Dockerfile

# The resolver is a pile of curl + sed over three upstream APIs; a format change upstream
# would otherwise surface as a silent fallback to the pins. Pinned mode must reproduce
# versions.env exactly, auto mode must find something at least as new.
resolver:
  stage: lint
  extends: .not_on_schedule
  image: alpine:3
  needs: []
  before_script:
    - apk add --no-cache curl
  script:
    - RESOLVE_MODE_OVERRIDE=pinned sh scripts/resolve-versions.sh pinned.env
    - . ./versions.env
    - |
      for k in PG_MAJOR PG_VERSION POSTGIS_VERSION TIMESCALEDB_VERSION DEBIAN_SUITE PLATFORMS PG_IMAGE_DIGEST; do
        eval want="\$$k"
        got="$(sed -n "s/^$k=//p" pinned.env)"
        [ "$got" = "$want" ] || { echo "FAIL: pinned $k = '$got', versions.env says '$want'" >&2; exit 1; }
      done
      echo "ok: pinned mode reproduces versions.env"
    - RESOLVE_MODE_OVERRIDE=auto sh scripts/resolve-versions.sh auto.env
    - |
      [ "$(sed -n 's/^RESOLVED_FROM=//p' auto.env)" = auto ] || { echo "FAIL: auto mode fell back to the pins — an upstream lookup is broken" >&2; exit 1; }
      newest="$(printf '%s\n%s\n' "$PG_VERSION" "$(sed -n 's/^PG_VERSION=//p' auto.env)" | sort -t. -k1,1n -k2,2n | tail -n 1)"
      [ "$newest" = "$(sed -n 's/^PG_VERSION=//p' auto.env)" ] || { echo "FAIL: auto mode found PostgreSQL $(sed -n 's/^PG_VERSION=//p' auto.env), older than the pinned $PG_VERSION" >&2; exit 1; }
      echo "ok: auto mode resolves to $(sed -n 's/^PG_VERSION=//p' auto.env) @ $(sed -n 's/^PG_IMAGE_DIGEST=//p' auto.env) / $(sed -n 's/^POSTGIS_VERSION=//p' auto.env) / $(sed -n 's/^TIMESCALEDB_VERSION=//p' auto.env)"

# --- build -------------------------------------------------------------------------------

# One multi-arch build, pushed to the staging registry. Everything downstream tests and
# publishes this exact digest.
build image:
  extends:
    - .docker
    - .not_on_schedule
  stage: build
  needs:
    - job: resolve versions
      artifacts: true
  before_script:
    - !reference [.docker, before_script]
    - export BUILDER_NAME="${DOCKER_BUILDER_NAME}"
    - docker buildx inspect "${BUILDER_NAME}" >/dev/null 2>&1
      || docker buildx create --name "${BUILDER_NAME}" --driver docker-container --use
  script:
    - sh scripts/docker-buildx-release.sh build
  artifacts:
    reports:
      dotenv: staging.env
    paths:
      - staging.env
      - staging-metadata.json
    expire_in: 1 week

# --- test --------------------------------------------------------------------------------

.test:
  extends:
    - .docker
    - .not_on_schedule
  stage: test
  needs:
    - job: resolve versions
      artifacts: true
    - job: build image
      artifacts: true
  after_script:
    - docker logout "${CI_REGISTRY}" || true

# Starts the image, asserts the versions, fills a hypertable, queries a spatial index, replays
# the Home Assistant LTSS DDL, checks the healthcheck and the defaults — per platform.
smoke test:
  extends: .test
  parallel:
    matrix:
      - PLATFORM: [linux/amd64, linux/arm64]
  script:
    - docker pull --platform "${PLATFORM}" "${STAGING_REF}"
    - PLATFORM="${PLATFORM}" sh scripts/smoke-test.sh "${STAGING_REF}"
  after_script:
    - docker rmi "${STAGING_REF}" >/dev/null 2>&1 || true
    - docker logout "${CI_REGISTRY}" || true

# Existing installs must survive the new image: the previously published :latest, the oldest
# published tag of the same major, and a real PostgreSQL <major> data directory for every
# older major the image can upgrade from — in both volume layouts. Runner architecture only.
upgrade test:
  extends: .test
  timeout: 2h
  script:
    - docker pull "${STAGING_REF}"
    - apk add --no-cache curl
    - sh scripts/upgrade-test.sh "${STAGING_REF}"
  after_script:
    - docker rmi "${STAGING_REF}" >/dev/null 2>&1 || true
    - docker logout "${CI_REGISTRY}" || true

compose test:
  extends: .test
  script:
    - docker pull "${STAGING_REF}"
    - sh scripts/compose-test.sh "${STAGING_REF}"

# Debian base + apt packages, rebuilt weekly: a CVE scan is cheap here. Informational — the
# image ships regardless, the job just goes red in the pipeline view.
vulnerability scan:
  extends: .not_on_schedule
  stage: test
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - job: resolve versions
      artifacts: true
    - job: build image
      artifacts: true
  allow_failure: true
  variables:
    TRIVY_USERNAME: gitlab-ci-token
    TRIVY_PASSWORD: $CI_JOB_TOKEN
    TRIVY_NO_PROGRESS: "true"
  script:
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${STAGING_REF}"

# --- publish -----------------------------------------------------------------------------

# Re-tags the tested staging digest onto Docker Hub. No build, no `docker push` of layers from
# the runner: imagetools copies the manifest list (with its provenance/SBOM attestations)
# registry-to-registry, then the script verifies what Docker Hub serves.
publish image:
  extends:
    - .docker
    - .publish_rules
  stage: publish
  # Publishing must not be auto-cancelled halfway by a new commit.
  interruptible: false
  needs:
    - job: resolve versions
      artifacts: true
    - job: build image
      artifacts: true
    - job: smoke test
      artifacts: false
    - job: upgrade test
      artifacts: false
    - job: compose test
      artifacts: false
  before_script:
    - !reference [.docker, before_script]
    # Credentials: DOCKERHUB_USERNAME/DOCKERHUB_TOKEN, or the CI_REGISTRY_USERNAME/
    # CI_REGISTRY_PASSWORD names used by the other KirboDev image repos — whichever is set.
    - export DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME:-${CI_REGISTRY_USERNAME:-}}"
    - export DOCKERHUB_TOKEN="${DOCKERHUB_TOKEN:-${CI_REGISTRY_PASSWORD:-}}"
    - |
      if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
        echo "ERROR: set DOCKERHUB_USERNAME + DOCKERHUB_TOKEN (masked) in Settings -> CI/CD -> Variables" >&2
        exit 1
      fi
    - echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin "${DOCKER_REGISTRY}"
  script:
    - sh scripts/docker-buildx-release.sh publish
  after_script:
    - docker logout "${DOCKER_REGISTRY}" || true
    - docker logout "${CI_REGISTRY}" || true
